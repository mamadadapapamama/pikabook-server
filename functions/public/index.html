<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pikabook Gemini Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loading { display: none; }
        .loading.active { display: flex; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-8">
    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">Pikabook Gemini 2.0 Demo</h1>
        
        <form id="uploadForm" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- 언어 선택 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Target Language</label>
                    <select id="language" name="language" class="w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="Korean">Korean (한국어)</option>
                        <option value="English">English (영어)</option>
                        <option value="Japanese">Japanese (일본어)</option>
                    </select>
                </div>

                <!-- 손글씨 제외 옵션 -->
                <div class="flex items-end pb-2">
                    <label class="inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="excludeHandwriting" class="sr-only peer">
                        <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                        <span class="ml-3 text-sm font-medium text-gray-700">Exclude Handwriting (손글씨 제외)</span>
                    </label>
                </div>
            </div>

            <!-- 이미지 업로드 -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Upload WebP Image</label>
                <input type="file" id="imageInput" accept="image/webp, image/jpeg, image/png" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-md hover:bg-blue-700 transition duration-200">
                분석 시작 (Analyze)
            </button>
        </form>

        <!-- 로딩 표시 -->
        <div id="loader" class="loading hidden items-center justify-center space-x-2 py-8">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
            <span class="text-blue-600 font-medium">Gemini가 분석 중입니다...</span>
        </div>

        <!-- 결과 표시 -->
        <div id="resultContainer" class="mt-8 hidden">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">분석 결과 (JSON)</h2>
            <pre id="jsonOutput" class="bg-gray-900 text-green-400 p-4 rounded-lg overflow-x-auto text-sm"></pre>
        </div>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const imageFile = document.getElementById('imageInput').files[0];
            if (!imageFile) {
                alert('이미지를 선택해주세요.');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            const loader = document.getElementById('loader');
            const resultContainer = document.getElementById('resultContainer');
            const jsonOutput = document.getElementById('jsonOutput');

            // UI 상태 변경
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-50');
            loader.classList.remove('hidden');
            loader.classList.add('active');
            resultContainer.classList.add('hidden');

            const formData = new FormData();
            formData.append('image', imageFile);
            formData.append('language', document.getElementById('language').value);
            formData.append('excludeHandwriting', document.getElementById('excludeHandwriting').checked);

            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                jsonOutput.textContent = JSON.stringify(data, null, 2);
                resultContainer.classList.remove('hidden');
            } catch (error) {
                alert('에러가 발생했습니다: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50');
                loader.classList.add('hidden');
                loader.classList.remove('active');
            }
        });
    </script>
</body>
</html>
